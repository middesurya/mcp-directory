<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#60a5fa"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Grid pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" opacity="0.3"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>
  
  <!-- Accent glow -->
  <ellipse cx="600" cy="200" rx="400" ry="200" fill="#3b82f6" opacity="0.1"/>
  
  <!-- Main content -->
  <text x="600" y="220" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="bold" fill="white">
    MCP Directory
  </text>
  
  <text x="600" y="290" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" fill="#94a3b8">
    The Definitive Model Context Protocol Server Directory
  </text>
  
  <!-- Stats boxes -->
  <g transform="translate(200, 350)">
    <rect x="0" y="0" width="200" height="100" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <text x="100" y="50" text-anchor="middle" font-family="system-ui, sans-serif" font-size="42" font-weight="bold" fill="url(#accent)">181</text>
    <text x="100" y="80" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" fill="#94a3b8">Servers</text>
  </g>
  
  <g transform="translate(500, 350)">
    <rect x="0" y="0" width="200" height="100" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <text x="100" y="50" text-anchor="middle" font-family="system-ui, sans-serif" font-size="42" font-weight="bold" fill="url(#accent)">22</text>
    <text x="100" y="80" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" fill="#94a3b8">Categories</text>
  </g>
  
  <g transform="translate(800, 350)">
    <rect x="0" y="0" width="200" height="100" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <text x="100" y="50" text-anchor="middle" font-family="system-ui, sans-serif" font-size="42" font-weight="bold" fill="url(#accent)">89</text>
    <text x="100" y="80" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" fill="#94a3b8">Official</text>
  </g>
  
  <!-- Tagline -->
  <text x="600" y="530" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" fill="#64748b">
    One-click configs for Claude Desktop • Cursor • Windsurf • Cline • VS Code
  </text>
  
  <!-- URL -->
  <text x="600" y="580" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" fill="#3b82f6">
    mcp-directory-pi.vercel.app
  </text>
</svg>
